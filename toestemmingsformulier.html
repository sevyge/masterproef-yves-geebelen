<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Masterproef Yves Geebelen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="graduation-hat.png" type="image/png">
</head>

<body class="container py-5" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <img src="uhasselt-liggend.png" alt="UHasselt Logo" class="img-fluid" style="max-width: 200px;">
        <span id="serverStatus"></span>
    </div>

    <div class="mb-4">
        <h5 class="text-muted">Toestemmingsformulier - Onderzoek: Masterproef Yves Geebelen</h5>
    </div>

    <div class="card mb-4">
        <div class="card-body p-0" style="height: 60vh;">
            <iframe src="toestemmingsformulier.pdf" width="100%" height="100%" style="border: none;">
                Uw browser ondersteunt geen PDF-weergave. U kunt het <a href="toestemmingsformulier.pdf">toestemmingsformulier hier downloaden</a>.
            </iframe>
        </div>
    </div>

    <form id="consentForm">
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="" id="consentCheck" required>
            <label class="form-check-label" for="consentCheck">
                Ik heb de bovenstaande informatie gelezen en ga akkoord om deel te nemen aan dit onderzoek.
            </label>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <a class="btn btn-danger btn" href="index.html">Ga terug</a>
            <button type="submit" class="btn btn-danger">Ik ga akkoord en ga verder</button>
        </div>
    </form>
    <script src="backendURL.js"></script>
    <script src="serverStatus.js"></script>
    <script>
        document.getElementById('consentForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            try {
                const response = await fetch(`${backendUrl()}/consent`, {
                    method: 'POST'
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('participant_id', data.participant_id);
                    window.location.href = 'startpagina.html';
                } else {
                    alert('Er is een fout opgetreden. Probeer het later opnieuw.');
                }
            } catch (error) {
                alert('Kan geen verbinding maken met de server.');
            }
        });
    </script>
</body>

</html>
