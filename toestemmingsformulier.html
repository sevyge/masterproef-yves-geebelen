<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Masterproef Yves Geebelen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="graduation-hat.png" type="image/png">
    <style>
        #signatureCanvas {
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            touch-action: none;
            width: 100%;
            height: 180px;
            background: #fff;
        }

        .signature-help {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>

<body class="container py-5" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <img src="uhasselt-liggend.png" alt="UHasselt Logo" class="img-fluid" style="max-width: 200px;">
        <span id="serverStatus"></span>
    </div>

    <div class="mb-4">
        <h5 class="text-muted">Toestemmingsformulier - Onderzoek: Masterproef Yves Geebelen</h5>
    </div>

    <div class="card mb-4">
        <div class="card-body p-0" style="height: 60vh;">
            <iframe src="Document 5 - toestemmingsformulier voor de deelnemer.pdf" width="100%" height="100%" style="border: none;">
                Uw browser ondersteunt geen PDF-weergave. U kunt het <a href="Document 5 - toestemmingsformulier voor de deelnemer.pdf">toestemmingsformulier hier downloaden</a>.
            </iframe>
        </div>
    </div>

    <form id="consentForm">
        <div class="mb-3">
            <label class="form-label" for="signatureCanvas">Handtekening</label>
            <canvas id="signatureCanvas"></canvas>
            <div class="d-flex justify-content-between mt-2">
                <span class="signature-help">Onderteken hierboven</span>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="clearSignatureBtn">Wis
                    handtekening</button>
            </div>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="" id="consentCheck" required>
            <label class="form-check-label" for="consentCheck">
                Ik heb de bovenstaande informatie gelezen en ga akkoord om deel te nemen aan dit onderzoek.
            </label>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <a class="btn btn-danger btn" href="inlichtingenblad.html">Ga terug</a>
            <button type="submit" class="btn btn-danger" id="submitBtn">
                <span class="spinner-border spinner-border-sm d-none" id="submitSpinner" role="status" aria-hidden="true"></span>
                <span id="submitText">Ik ga akkoord en ga verder</span>
            </button>
        </div>
    </form>
    <script src="backendURL.js"></script>
    <script src="serverStatus.js"></script>
    <script src="toestemmingsformulier.js"></script>
</body>

</html>
