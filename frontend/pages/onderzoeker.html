<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onderzoeker Annotatietool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" href="../assets/images/graduation-hat.png" type="image/png">
</head>
<body class="overflow-hidden bg-light">
    <!-- Login Screen -->
    <div id="loginScreen" class="vh-100 w-100 d-flex justify-content-center align-items-center bg-light position-absolute top-0 start-0 z-3">
        <div class="card shadow-sm border-0 p-4 bg-white text-center" style="max-width: 320px; width: 90%;">
            <img src="../assets/images/uhasselt-liggend.png" alt="UHasselt Logo" class="mx-auto img-fluid mb-3" style="max-width: 140px;">
            <h5 class="mb-3 fw-bold text-secondary">Onderzoeker tools</h5>
            <input type="password" class="form-control mb-3" id="loginPassword" placeholder="Wachtwoord" onkeydown="if(event.key==='Enter') attemptLogin()">
            <button class="btn btn-danger w-100 fw-semibold" onclick="attemptLogin()">Inloggen</button>
        </div>
    </div>

    <div class="container-fluid vh-100 d-flex flex-column p-3 d-none" id="mainWorkspace">
        <!-- Top Navigation Header -->
        <div class="row align-items-center mb-3">
            <div class="col-md-6 d-flex align-items-center">
                <img src="../assets/images/uhasselt-liggend.png" alt="UHasselt Logo" class="img-fluid me-3" style="max-width: 150px;">
                <h5 class="m-0 fw-bold border-start ps-3 text-secondary">Onderzoeker Annotatietool</h5>
            </div>
            <div class="col-md-6 d-flex justify-content-end align-items-center gap-3">
                <div class="form-check form-switch m-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="toggleLlmAnnotations">
                    <label class="form-check-label small fw-semibold text-secondary" for="toggleLlmAnnotations">Toon LLM suggesties</label>
                </div>
                <button class="btn btn-sm btn-outline-secondary" id="classifyBtn">
                    <i class="bi bi-cpu me-1"></i> LLM classificatie uitvoeren
                </button>
                <div class="d-flex align-items-center gap-2">
                    <label for="participantSelect" class="text-nowrap m-0 fw-semibold text-secondary">Deelnemer:</label>
                    <select class="form-select form-select-sm" id="participantSelect" style="width: 180px;">
                    </select>
                </div>
                <button class="btn btn-sm btn-outline-danger" onclick="window.location.reload()" title="Uitloggen">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="row flex-grow-1 overflow-hidden">
            <!-- Left Panel: Segments List -->
            <div class="col-md-3 d-flex flex-column h-100">
                <div class="card h-100 shadow-sm overflow-hidden">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
                        <span class="fw-bold text-secondary">Segmenten</span>
                        <span class="badge bg-secondary" id="progressIndicator">0 / 0</span>
                    </div>
                    <div class="list-group list-group-flush overflow-auto" id="segmentsList" style="height: calc(100vh - 120px);">
                    </div>
                </div>
            </div>

            <!-- Center Panel: Transcript Box and Screenshot View -->
            <div class="col-md-6 d-flex flex-column h-100">
                <!-- Transcript Card -->
                <div class="card mb-3 shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
                        <span class="fw-bold text-secondary">Transcriptie</span>
                        <small class="text-muted fst-italic">Sleep over tekst om te selecteren</small>
                    </div>
                    <div class="card-body p-2">
                        <div class="border rounded p-3 bg-white fs-5 lh-lg" id="transcriptContainer" style="min-height: 120px; user-select: text;">
                        </div>
                    </div>
                </div>

                <!-- Screenshot Card -->
                <div class="card flex-grow-1 overflow-hidden shadow-sm mb-2">
                    <div class="card-header bg-white py-2">
                        <span class="fw-bold text-secondary">Schermopname Context</span>
                    </div>
                    <div class="card-body p-2 d-flex flex-column justify-content-center align-items-center overflow-auto">
                        <div class="border rounded bg-body-secondary d-flex align-items-center justify-content-center w-100 h-100" id="screenshotViewer" style="min-height: 350px;">
                            <span class="text-muted" id="screenshotPlaceholder">
                                <i class="bi bi-image fs-1 d-block text-center"></i>Screenshot context
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Annotations list, save action, and legend -->
            <div class="col-md-3 d-flex flex-column h-100">
                <!-- Active Annotations List -->
                <div class="card flex-grow-1 overflow-hidden shadow-sm mb-3">
                    <div class="card-header bg-white py-2">
                        <span class="fw-bold text-secondary">Jouw Annotaties</span>
                    </div>
                    <div class="card-body p-3 d-flex flex-column justify-content-between overflow-hidden">
                        <div id="annotationsList" class="flex-grow-1 overflow-auto" style="height: calc(100vh - 200px);">
                        </div>
                        <button class="btn btn-danger w-100 py-2 mt-3 fw-semibold shadow-sm" id="saveBtn">
                            <i class="bi bi-floppy"></i> Annotaties Opslaan
                        </button>
                    </div>
                </div>

                <!-- Legend & Shortcuts -->
                <div class="card shadow-sm mb-2">
                    <div class="card-header bg-white py-2">
                        <span class="fw-bold text-secondary"><i class="bi bi-info-circle"></i> Legende</span>
                    </div>
                    <div class="card-body p-3 small">
                        <!-- Legend Badges -->
                        <div class="d-flex flex-column gap-2 mb-3">
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-warning text-dark text-center" style="width: 45px;">DK</span>
                                <span class="text-secondary">Declaratieve kennis</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-primary text-center" style="width: 45px;">PK</span>
                                <span class="text-secondary">Procedurele kennis</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-success text-center" style="width: 45px;">CK</span>
                                <span class="text-secondary">Conditionele kennis</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-danger text-center" style="width: 45px;">DOM</span>
                                <span class="text-secondary">Domeinkennis</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-secondary text-center" style="width: 45px;">NONE</span>
                                <span class="text-secondary">Geen kennistype</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="selectionPopup" class="d-none position-absolute card shadow-sm z-3" style="width: auto;">
        <div class="card-body p-1 d-flex gap-1 bg-white border rounded">
            <button class="btn btn-sm btn-warning fw-bold text-dark popup-btn px-2" data-label="DK" title="Declaratieve kennis">DK</button>
            <button class="btn btn-sm btn-primary fw-bold text-white popup-btn px-2" data-label="PK" title="Procedurele kennis">PK</button>
            <button class="btn btn-sm btn-success fw-bold text-white popup-btn px-2" data-label="CK" title="Conditionele kennis">CK</button>
            <button class="btn btn-sm btn-danger fw-bold text-white popup-btn px-2" data-label="DOM" title="Domeinkennis">DOM</button>
            <button class="btn btn-sm btn-secondary fw-bold text-white popup-btn px-2" data-label="NONE" title="Geen kennistype">NONE</button>
        </div>
    </div>

    <script src="../js/backendURL.js"></script>
    <script src="../js/onderzoeker.js"></script>
</body>
</html>
